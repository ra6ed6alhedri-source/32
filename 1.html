<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي السريع</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #f4f4f9;
            color: #333;
            line-height: 1.6;
        }
        header {
            background-color: #2b3a4a;
            color: white;
            padding: 1.5rem;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            background-color: #1e2832;
            padding: 10px;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-size: 0.95rem;
        }
        nav a:hover {
            color: #00bcd4;
        }
        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        button {
            background-color: #00bcd4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover {
            background-color: #0097a7;
        }
        footer {
            text-align: center;
            padding: 1rem;
            color: #666;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>مرحباً بك في موقعي</h1>
        <p>صفحة بسيطة وسريعة الاستجابة</p>
    </header>

    <nav>
        <a href="#about">عن الموقع</a>
        <a href="#services">الخدمات</a>
        <a href="#contact">تواصل معنا</a>
    </nav>

    <div class="container">
        <section id="about" class="card">
            <h2>من نحن</h2>
            <p>هذا قالب متكامل يحتوي على هيكل HTML بتنسيقات CSS جاهزة لتجربة سريعة وأنيقة.</p>
        </section>

        <section id="services" class="card">
            <h2>خدماتنا</h2>
            <p>يمكنك التعديل على الكود بسهولة لإضافة نصوصك، صورك، أو خدماتك الخاصة.</p>
            <br>
            <button onclick="alert('أهلاً بك!')">اضغط هنا</button>
        </section>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026</p>
    </footer>

</body>
</html>
